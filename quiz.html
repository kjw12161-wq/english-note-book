<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어시험 - Lesson 3 & 4</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="quiz.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="text-gray-800">
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1>English Study Note</h1>
        <p>Lesson 3 · Lesson 4 단어시험</p>
      </div>
      <nav class="page-nav"></nav>
    </div>
  </header>

  <main class="quiz-shell">
    <section class="quiz-hero">
      <div style="font-size:.8rem;font-weight:900;letter-spacing:.12em;opacity:.8;">VOCABULARY TEST</div>
      <h2 style="font-size:2rem;font-weight:900;margin-top:.4rem;">Lesson 3 · 4 단어시험</h2>
      <p style="margin-top:.65rem;line-height:1.7;opacity:.92;">Lesson 3과 Lesson 4의 문장에서 중요 내용과 암기할 가치가 높은 어려운 어휘를 골라 한 단어씩 빈칸으로 만들었습니다.</p>
      <div class="quiz-meta">
        <span class="meta-pill">총 20문제</span>
        <span class="meta-pill">Lesson 3 · 10문제</span>
        <span class="meta-pill">Lesson 4 · 10문제</span>
        <span class="meta-pill">제한시간 25분</span>
        <span class="meta-pill">1문제 1점</span>
      </div>
    </section>

    <div class="timer-bar">
      <strong>남은 시간</strong>
      <span id="timer" class="timer">25:00</span>
    </div>

    <form id="quiz" novalidate></form>

    <div class="submit-row">
      <button id="submit-quiz" class="submit-btn" type="button">시험 제출하고 채점하기</button>
    </div>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
